<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Player</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Comforter&amp;family=Rubik+Glitch&amp;family=Comforter+Brush&amp;family=Electrolize&amp;family=Jura:wght@300..700&amp;family=Zen+Loop:ital@0;1&amp;family=Doto:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/player_style.css" />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  </head>

  <body>
    <canvas id="visualizer"></canvas>
    <!-- NAV START -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container p-2">
        <img
          src="images/wyze-logo-large.png"
          width="80"
          height="80"
          class="me-2 d-inline-block align-text-top wyze-logo"
          alt=""
        />

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="library.html">Library</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- NAV END -->
    <div id="ui-overlay">
      <div class="playlist">
        <h3>Playlist</h3>
        <ul id="track-list"></ul>
      </div>

      <div class="player-container sticky">
        <div class="inner-container">
          <div class="track-title-time">
            <span id="current-title">Track 1</span>
            <span id="current-time">0:00 / 0:00</span>
          </div>
          <input type="range" id="progress" value="0" step="1" />
          <div class="controls">
            <button id="prev"><i class="fas fa-backward"></i></button>
            <button id="play"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-forward"></i></button>
            <div class="volume-control">
              <button id="mute"><i class="fas fa-volume-up"></i></button>
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script src="/scripts/player.js"></script>
  </body>
</html>
